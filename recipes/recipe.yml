---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue-gs
description: Custom Silverblue images forked from birdietx/silverblue with steam, gamescope and minimal tooling installed for gaming on Linux.
base-image: ghcr.io/birdietx/silverblue
image-version: latest

modules:
  - type: dnf
    repos:
      enable:
        - brave-browser
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - fedora-rar
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        enable:
          - ublue-os/packages

  - type: script
    snippets:
      - "dnf5 upgrade --allow-vendor-change --assumeyes --refresh"

  - type: dnf
    install:
      packages:
        - gamescope
        - steam

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.mattjakeman.ExtensionManager
          - com.saivert.pwvucontrol
          - com.vixalien.sticky

  - type: dnf
    repos:
      disable:
        - brave-browser
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - fedora-rar
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        disable:
          - ublue-os/packages

  - type: brew
    auto-update: true
    auto-upgrade: true
    brew-analytics: false
    update-interval: 7d
    update-wait-after-boot: 10m
    upgrade-interval: 7d
    upgrade-wait-after-boot: 30m

  - type: os-release
    properties:
      PRETTY_NAME: "Fedora Linux 44 (Silverblue)"
      VERSION_CODENAME: "Bluebird GS"

  - type: signing