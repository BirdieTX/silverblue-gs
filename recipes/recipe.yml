---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue-gs
description: Custom Silverblue images forked from birdietx/silverblue with steam, gamescope and minimal tooling installed for gaming on Linux.
base-image: ghcr.io/birdietx/silverblue
image-version: latest

modules:
  - type: dnf
    repos:
      enable:
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        enable:
          - ublue-os/packages

  - type: dnf
    install:
      exclude:
        - mangohud
      packages:
        - steam
        - terra-gamescope
        - terra-mangohud

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.brave.Browser
          - com.github.neithern.g4music
          - com.github.tchx84.Flatseal
          - com.mattjakeman.ExtensionManager
          - com.saivert.pwvucontrol
          - com.vixalien.sticky
          - io.missioncenter.MissionCenter
          - org.gnome.baobab
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Decibels
          - org.gnome.font-viewer
          - org.gnome.Logs
          - org.gnome.Loupe
          - org.gnome.Papers
          - org.gnome.Showtime
          - org.gnome.SimpleScan
          - org.gnome.Snapshot
          - org.gnome.TextEditor
          - org.gnome.Weather
          - org.libreoffice.LibreOffice

  - type: dnf
    repos:
      disable:
        - fedora
        - fedora-cisco-openh264
        - fedora-multimedia
        - terra
        - terra-mesa
        - updates
        - updates-archive
      copr:
        disable:
          - ublue-os/packages

  - type: brew
    auto-update: true
    auto-upgrade: true
    brew-analytics: false
    update-interval: 7d
    update-wait-after-boot: 10m
    upgrade-interval: 7d
    upgrade-wait-after-boot: 30m

  - type: os-release
    properties:
      PRETTY_NAME: "Fedora Linux 44 (Silverblue)"
      VERSION_CODENAME: "Bluebird GS"

  - type: signing